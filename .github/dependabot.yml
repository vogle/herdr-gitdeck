# Keeps the commit-pinned GitHub Actions and the dev dependencies current.
# Dependabot updates the SHA and its "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
