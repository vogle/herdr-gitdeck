name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The core (src/core) runs without Herdr: tests, coverage gate and its types.
      - run: pnpm exec tsc -p tsconfig.test.json --noEmit
      - run: pnpm coverage
      # The mod itself needs the Herdr app's type files and `herdr-app check`,
      # so `pnpm typecheck` and `pnpm dev` run locally (see docs/DEVELOPMENT.md).
