name: release
# release-please keeps a release PR open on main: the next version (from feat:/fix:
# commit messages), package.json and CHANGELOG.md. Merging that PR tags vX.Y.Z,
# creates the GitHub release, and this workflow attaches gitdeck.tar.gz to it.
# Installed copies find it within a day and offer a one-click update (src/updater.ts).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits: this job publishes what every installed copy runs.
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: ${{ steps.rp.outputs.release_created }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: ${{ steps.rp.outputs.release_created }}
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: ${{ steps.rp.outputs.release_created }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - if: ${{ steps.rp.outputs.release_created }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.rp.outputs.release_created }}
        run: pnpm exec tsc -p tsconfig.test.json --noEmit && pnpm coverage
      - if: ${{ steps.rp.outputs.release_created }}
        run: pnpm build && tar -czf gitdeck.tar.gz -C dist gitdeck
      - if: ${{ steps.rp.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh release upload "$TAG" gitdeck.tar.gz
